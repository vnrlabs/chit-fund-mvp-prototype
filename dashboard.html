<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · ChitFlow</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/modules.css"></head><body data-page="dashboard" data-title="Dashboard">
<template id="page-template">
  <div class="page-head"><div class="page-title"><h1>Operations Dashboard</h1><p>Today’s view of active chits, auctions, member collections and payout actions.</p></div><div class="page-actions"><a class="btn btn-secondary" href="members.html">+ New Member</a><a class="btn btn-primary" href="chits.html#create">+ Create Chit</a></div></div>
  <div class="grid grid-4" style="margin-bottom:16px">
    <div class="card metric"><div class="metric-top"><span>ACTIVE CHITS</span><span class="metric-icon">◫</span></div><div class="metric-value">12</div><div class="metric-note">4 auctions in next 7 days</div></div>
    <div class="card metric"><div class="metric-top"><span>OPEN CHITS</span><span class="metric-icon">○</span></div><div class="metric-value">5</div><div class="metric-note">37 member slots to fill</div></div>
    <div class="card metric"><div class="metric-top"><span>PENDING COLLECTION</span><span class="metric-icon">₹</span></div><div class="metric-value">₹6.42L</div><div class="metric-note"><span class="badge badge-danger"><span class="dot"></span>8 overdue</span></div></div>
    <div class="card metric"><div class="metric-top"><span>PAYOUT ACTIONS</span><span class="metric-icon">↗</span></div><div class="metric-value">3</div><div class="metric-note">₹18.7L pending disbursement</div></div>
  </div>
  <div class="split-7-3">
    <div class="section-stack">
      <section class="card"><div class="card-head"><div><h3>Upcoming Auctions</h3><p>Next scheduled monthly cycles</p></div><a class="action-link" href="auction.html">View monthly auction →</a></div><div class="table-wrap"><table><thead><tr><th>Chit</th><th>Cycle</th><th>Auction</th><th>Members</th><th>Strategy</th><th>Status</th></tr></thead><tbody id="auctionRows"></tbody></table></div></section>
      <section class="card"><div class="card-head"><div><h3>Collection Attention</h3><p>Members requiring collection follow-up</p></div><a class="action-link" href="payments.html">Open collections →</a></div><div class="table-wrap"><table><thead><tr><th>Member</th><th>Chit</th><th>Amount</th><th>Age</th><th>Status</th></tr></thead><tbody><tr><td><div class="member-cell"><div class="avatar">LP</div><div><strong>Lakshmi P</strong><span>MB-10078</span></div></div></td><td>Akshaya 10L / 20</td><td class="amount">₹89,000</td><td>61 days</td><td><span class="badge badge-danger">Delinquent</span></td></tr><tr><td><div class="member-cell"><div class="avatar">MR</div><div><strong>Meena R</strong><span>MB-10034</span></div></div></td><td>Akshaya 10L / 20</td><td class="amount">₹44,500</td><td>32 days</td><td><span class="badge badge-warning">Overdue</span></td></tr><tr><td><div class="member-cell"><div class="avatar">DM</div><div><strong>Divya M</strong><span>MB-10123</span></div></div></td><td>Sree 12L / 24</td><td class="amount">₹46,300</td><td>6 days</td><td><span class="badge badge-warning">Pending</span></td></tr></tbody></table></div></section>
    </div>
    <div class="section-stack">
      <section class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong>August collection</strong><div class="muted" style="font-size:10px;margin-top:4px">Across current active cycles</div></div><span class="badge badge-success">On track</span></div><div class="donut" style="margin-top:18px"></div><div class="kv" style="margin-top:20px"><div class="kv-row"><span>Collected</span><strong>₹23.84L</strong></div><div class="kv-row"><span>Outstanding</span><strong>₹6.42L</strong></div><div class="kv-row"><span>Collection rate</span><strong>78%</strong></div></div></section>
      <section class="card card-pad"><strong>Recent activity</strong><div class="timeline" style="margin-top:16px"><div class="timeline-row"><div class="timeline-line"><span class="timeline-dot"></span><span class="timeline-stem"></span></div><div class="timeline-content"><strong>Cycle 8 auction finalized</strong><span>Akshaya 10L / 20 · 34 min ago</span></div></div><div class="timeline-row"><div class="timeline-line"><span class="timeline-dot"></span><span class="timeline-stem"></span></div><div class="timeline-content"><strong>Payment recorded</strong><span>Vijay S · ₹44,500 · 1 hr ago</span></div></div><div class="timeline-row"><div class="timeline-line"><span class="timeline-dot"></span><span class="timeline-stem"></span></div><div class="timeline-content"><strong>Member added to open chit</strong><span>Mangalam 5L / 20 · 2 hr ago</span></div></div><div class="timeline-row"><div class="timeline-line"><span class="timeline-dot"></span></div><div class="timeline-content"><strong>Chit strategy snapshot created</strong><span>Sree 12L / 24 · yesterday</span></div></div></div></section>
    </div>
  </div>
</template><script src="js/data.js"></script><script src="js/layout.js"></script><script src="js/common.js"></script><script src="js/dashboard.js"></script></body></html>
