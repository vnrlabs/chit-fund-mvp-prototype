<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chits · ChitFlow</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/modules.css"></head><body data-page="chits" data-title="Chits">
<template id="page-template">
  <div class="page-head"><div class="page-title"><h1>Chit Lifecycle</h1><p>Create, clone, progressively fill, review, activate and monitor each chit.</p></div><div class="page-actions"><button class="btn btn-secondary" id="cloneChit">Clone Chit</button><button class="btn btn-primary" id="newChit">+ Create Chit</button></div></div>
  <div data-tabs>
    <div class="tabs"><button class="tab active" data-target="chit-list">Chit List</button><button class="tab" data-target="create-chit">Create / Review</button><button class="tab" data-target="chit-overview">Chit Overview</button><button class="tab" data-target="chit-members">Members</button></div>
    <section class="tab-panel active" id="chit-list"><div class="card"><div class="toolbar"><div class="toolbar-left"><input class="input input-sm search" id="chitSearch" placeholder="Search chit / ID"><select class="select select-sm" id="statusFilter"><option>All statuses</option><option>Active</option><option>Open</option></select></div><div class="toolbar-right"><span class="muted" id="chitCount">4 chits</span></div></div><div class="table-wrap"><table id="chitTable"><thead><tr><th>Chit</th><th>Status</th><th>Value</th><th>Members</th><th>Cycle</th><th>Next Auction</th><th>Strategy</th><th>Actions</th></tr></thead><tbody id="chitRows"></tbody></table></div></div></section>
    <section class="tab-panel" id="create-chit"><div class="steps"><div class="step done"><span class="step-num">1</span><span>Basic details</span></div><div class="step done"><span class="step-num">2</span><span>Financial setup</span></div><div class="step active"><span class="step-num">3</span><span>Members</span></div><div class="step"><span class="step-num">4</span><span>Review</span></div></div><div class="split-7-3"><div class="card card-pad"><h3 style="margin-top:0">Create New Chit</h3><div class="form-grid-3"><div class="field"><label>Chit Name</label><input class="input" value="Mangalam 5L / 20"></div><div class="field"><label>Chit Value</label><input class="input" value="₹5,00,000"></div><div class="field"><label>Duration / Member Slots</label><input class="input" value="20"></div><div class="field"><label>Start Month</label><input class="input" type="month" value="2026-09"></div><div class="field"><label>Base Installment</label><input class="input" value="₹25,000"></div><div class="field"><label>Calculation Strategy</label><select class="select"><option>CALC-S3 · Fixed + End Dividend</option><option>CALC-S2 · Immediate Dividend</option><option>CALC-S1 · Duration Reduction</option></select></div></div><div class="callout" style="margin-top:14px">This chit can be saved in <strong>Open</strong> status before all 20 member slots are filled. Activation requires readiness checks.</div><div style="margin-top:18px;display:flex;justify-content:space-between;align-items:center"><div><strong>Member allocation</strong><div class="muted" style="font-size:10px;margin-top:3px">17 of 20 slots filled</div></div><button class="btn btn-soft btn-sm" id="addMemberToChit">+ Add member</button></div><div class="progress" style="margin-top:9px"><span style="width:85%"></span></div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Member</th><th>Position</th><th>Payment Preference</th><th></th></tr></thead><tbody><tr><td><div class="member-cell"><div class="avatar">AK</div><div><strong>Arun Kumar</strong><span>MB-10021</span></div></div></td><td>#01</td><td>UPI</td><td><a class="action-link">Remove</a></td></tr><tr><td><div class="member-cell"><div class="avatar">MR</div><div><strong>Meena R</strong><span>MB-10034</span></div></div></td><td>#02</td><td>Bank Transfer</td><td><a class="action-link">Remove</a></td></tr><tr><td colspan="4" class="muted">+ 15 more allocated members</td></tr></tbody></table></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn btn-secondary">Save as Open</button><button class="btn btn-primary" id="reviewChit">Review Chit</button></div></div><div class="section-stack"><div class="card card-pad"><strong>Readiness</strong><div class="kv" style="margin-top:14px"><div class="kv-row"><span>Basic details</span><strong>Complete</strong></div><div class="kv-row"><span>Strategy selected</span><strong>CALC-S3 v1.0</strong></div><div class="kv-row"><span>Members filled</span><strong>17 / 20</strong></div><div class="kv-row"><span>Activation</span><strong style="color:var(--warning)">Not ready</strong></div></div></div><div class="card card-pad"><strong>Strategy snapshot</strong><p class="muted" style="font-size:10px;line-height:1.5">The selected strategy and version are locked when the chit is activated. Running chits are not retroactively changed.</p><a href="calculator.html" class="action-link">Open calculator simulation →</a></div></div></div></section>
    <section class="tab-panel" id="chit-overview"><div class="stat-strip"><div><span>Status</span><strong><span class="badge badge-success">Active</span></strong></div><div><span>Chit Value</span><strong>₹10,00,000</strong></div><div><span>Cycle Progress</span><strong>8 / 20</strong></div><div><span>Next Auction</span><strong>28 Aug 2026</strong></div></div><div class="split-7-3" style="margin-top:16px"><div class="card"><div class="card-head"><div><h3>Monthly History</h3><p>Agreed operating column order</p></div></div><div class="table-wrap"><table><thead><tr><th>Month Cycle</th><th>Auction Date</th><th>Installment Amount</th><th>Thallupadi</th><th>Payout Amount</th><th>Winning Member / ID</th><th>Actions</th></tr></thead><tbody><tr><td>08 / 20</td><td>28 Jul 2026</td><td class="amount">₹44,500</td><td class="amount">₹2,10,000</td><td class="amount">₹7,90,000</td><td>Vijay S <span class="muted">/ MB-10056</span></td><td><a href="auction.html" class="action-link">Monthly view</a></td></tr><tr><td>07 / 20</td><td>28 Jun 2026</td><td class="amount">₹45,250</td><td class="amount">₹1,95,000</td><td class="amount">₹8,05,000</td><td>Karthik N <span class="muted">/ MB-10110</span></td><td><a href="auction.html" class="action-link">Monthly view</a></td></tr><tr><td>06 / 20</td><td>28 May 2026</td><td class="amount">₹46,000</td><td class="amount">₹1,80,000</td><td class="amount">₹8,20,000</td><td>Arun Kumar <span class="muted">/ MB-10021</span></td><td><a href="auction.html" class="action-link">Monthly view</a></td></tr></tbody></table></div></div><div class="section-stack"><div class="card card-pad"><strong>Chit Details</strong><div class="kv" style="margin-top:12px"><div class="kv-row"><span>Strategy</span><strong>CALC-S2 v1.0</strong></div><div class="kv-row"><span>Owner Chit</span><strong>No</strong></div><div class="kv-row"><span>Member slots</span><strong>20 / 20</strong></div><div class="kv-row"><span>Start date</span><strong>28 Dec 2025</strong></div></div></div><div class="card card-pad"><strong>Cycle collection</strong><div class="metric-value" style="font-size:23px">88%</div><div class="progress"><span style="width:88%"></span></div><p class="muted" style="font-size:10px">17 paid · 1 pending · 2 overdue</p></div></div></div></section>
    <section class="tab-panel" id="chit-members"><div class="card"><div class="toolbar"><div class="toolbar-left"><input class="input input-sm search" placeholder="Search participating member"></div><div class="toolbar-right"><span class="badge badge-success">20 / 20 filled</span></div></div><div class="table-wrap"><table><thead><tr><th>Member</th><th>Position</th><th>Bid Won</th><th>Current Due</th><th>Payment Pattern</th><th></th></tr></thead><tbody id="chitMemberRows"></tbody></table></div></div></section>
