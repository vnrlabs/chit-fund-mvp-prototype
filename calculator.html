<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chit Calculator · ChitFlow</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/modules.css"></head><body data-page="calculator" data-title="Chit Calculator">
<template id="page-template"><div class="page-head"><div class="page-title"><h1>Chit Calculation Strategy</h1><p>Select an approved MVP strategy, apply the optional first-month owner modifier and simulate a cycle before activation.</p></div><div class="page-actions"><span class="badge badge-info">Strategy Engine · v1.0</span></div></div>
<div class="split-6-4"><div class="section-stack"><section class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><strong>1. Select Primary Strategy</strong><div class="muted" style="font-size:10px;margin-top:3px">One primary strategy is required per chit.</div></div><span class="badge badge-success">Approved MVP templates</span></div><div class="grid grid-3" id="strategyCards"><div class="strategy-card" data-strategy="S1"><span class="check">✓</span><h4>CALC-S1 · Duration Reduction</h4><p>Fixed monthly installment. Dividend becomes contribution credit and can reduce total chit duration.</p></div><div class="strategy-card selected" data-strategy="S2"><span class="check">✓</span><h4>CALC-S2 · Immediate Dividend</h4><p>Dividend is distributed immediately by reducing the member installment for the current cycle.</p></div><div class="strategy-card" data-strategy="S3"><span class="check">✓</span><h4>CALC-S3 · End Settlement</h4><p>Fixed installment. Dividend accumulates in a member balance and is settled at the end.</p></div></div></section>
<section class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong>2. Optional Modifier</strong><div class="muted" style="font-size:10px;margin-top:3px">Can be combined with any MVP primary strategy.</div></div><label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="ownerChit"> First Month Owner Chit</label></div><div class="callout" style="margin-top:12px">When enabled, Cycle 1 is allocated to the organizer: no auction, no thallupadi and no dividend. The selected strategy begins from the following cycle.</div></section>
<section class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><strong>3. Simulation Inputs</strong><div class="muted" style="font-size:10px;margin-top:3px">Use sample outcomes to understand strategy behavior before activation.</div></div><button class="btn btn-secondary btn-sm" id="resetCalc">Reset</button></div><div class="form-grid-3"><div class="field"><label>Chit Value</label><input class="input calc-input" id="chitValue" type="number" value="1000000"></div><div class="field"><label>Members / Base Duration</label><input class="input calc-input" id="members" type="number" value="20"></div><div class="field"><label>Current Cycle</label><input class="input calc-input" id="cycle" type="number" value="8"></div><div class="field"><label>Base Monthly Installment</label><input class="input calc-input" id="baseInstallment" type="number" value="50000"></div><div class="field"><label>Winning Thallupadi</label><input class="input calc-input" id="discount" type="number" value="210000"></div><div class="field"><label>Accumulated Dividend Balance</label><input class="input calc-input" id="divBalance" type="number" value="36000"></div></div><div class="callout callout-warning" style="margin-top:14px">Prototype formulas are illustrative. Production uses signed golden examples, explicit rounding and approved strategy versions.</div></section></div>
<div class="section-stack"><div class="calc-result"><span class="muted" style="font-size:10px">SIMULATED MEMBER DUE</span><div class="big" id="memberDue">₹39,500</div><div class="result-grid"><div class="result-item"><span>Winner payout</span><strong id="winnerPayout">₹7,90,000</strong></div><div class="result-item"><span>Dividend / member</span><strong id="divPerMember">₹10,500</strong></div><div class="result-item"><span>Dividend treatment</span><strong id="divTreatment">Immediate reduction</strong></div><div class="result-item"><span>Projected duration</span><strong id="projDuration">20 months</strong></div><div class="result-item"><span>Dividend balance</span><strong id="newBalance">₹36,000</strong></div><div class="result-item"><span>Strategy snapshot</span><strong id="snapshot">CALC-S2 v1.0</strong></div></div></div><div class="card card-pad"><strong>Standard Calculation Contract</strong><div class="kv" style="margin-top:12px"><div class="kv-row"><span>Gross installment</span><strong id="grossOut">₹50,000</strong></div><div class="kv-row"><span>Thallupadi</span><strong id="discountOut">₹2,10,000</strong></div><div class="kv-row"><span>Dividend pool</span><strong id="poolOut">₹2,10,000</strong></div><div class="kv-row"><span>Actual member due</span><strong id="dueOut">₹39,500</strong></div><div class="kv-row"><span>Winner payout</span><strong id="payoutOut">₹7,90,000</strong></div></div></div><div class="card card-pad"><strong>Activation behavior</strong><p class="muted" style="font-size:10px;line-height:1.5">On activation, strategy ID, version, parameters and modifier selection are snapshotted. Normal users cannot switch the strategy of an active chit.</p><span class="badge badge-success">Deterministic + auditable</span></div></div></div></template><script src="js/data.js"></script><script src="js/layout.js"></script><script src="js/common.js"></script><script src="js/calculator.js"></script></body></html>
